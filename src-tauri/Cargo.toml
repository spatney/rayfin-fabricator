[package]
name = "rayfin-fabricator"
version = "1.23.0"
description = "Fabricator — a desktop app for building Rayfin apps via chat, wrapping the GitHub Copilot CLI and the Rayfin CLI."
authors = ["Fabricator"]
license = "MIT"
repository = "https://github.com/spatney/rayfin-fabricator"
edition = "2021"
# Bumped from 1.77.2 for github-copilot-sdk, which requires Rust >= 1.94 (it is an
# edition-2024 crate). This crate stays edition 2021; only the toolchain must be >= 1.94.
rust-version = "1.94"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `devtools` enables the WebView2/WebKit web inspector (and `Webview::open_devtools`)
# in RELEASE builds too, not just debug — the preview toolbar exposes a button that
# opens it so users can inspect their deployed app's DOM/console/network.
tauri = { version = "2.12", features = ["unstable", "devtools"] }
tauri-plugin-log = "2.10"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-updater = "2.13"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
log = "0.4"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"

# GitHub Copilot CLI, driven via JSON-RPC instead of the old one-shot `copilot -p`
# exec path. The default `bundled-cli` feature embeds a version-pinned Copilot CLI
# at build time (downloaded by its build.rs) and self-extracts it to
# %LOCALAPPDATA%\github-copilot-sdk\cli\<ver>\copilot.exe at runtime, so the app is
# self-contained (no separate install). Build requires network; cache via
# BUNDLED_CLI_CACHE_DIR in CI.
github-copilot-sdk = "1.0.20"

uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
regex = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["clock"], default-features = false }

# native-tls: the OS TLS stack and trust store (SChannel / Security.framework), the same one
# the Copilot SDK's reqwest already uses in this process, so corporate root CAs are trusted.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }

# The local relay for a model provider whose API rejects fields the Copilot runtime sends
# (services/byok/relay.rs). The same hyper stack reqwest already uses.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

dirs = "7"
which = "8"
trash = "5"
thiserror = "2"
anyhow = "1"

# Extract user-uploaded custom-skill `.zip` bundles (see commands/custom_skills.rs).
# `enclosed_name()` is used on entries to guard against zip-slip path traversal.
zip = { version = "9", default-features = false, features = ["deflate"] }

# Windows-only: capture the native WebView2 preview to a PNG (ICoreWebView2::CapturePreview).
# webview2-com / windows versions are pinned to what the vendored wry (and tauri) resolve to,
# so Cargo unifies them rather than pulling a second copy. See services/preview.rs.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

# macOS-only: capture the native WKWebView preview to a PNG via
# -[WKWebView takeSnapshotWithConfiguration:completionHandler:]. objc2 versions are
# pinned to what the vendored wry resolves to so Cargo unifies them. See services/preview.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSData",
  "NSDictionary",
  "NSDate",
  "NSRunLoop",
  "NSError",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "WKWebView",
  "WKSnapshotConfiguration",
] }
# Keychain storage for the user's own model provider API keys (services/byok).
# Already in the tree through native-tls, so no new crates.
security-framework = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Vendored copy of wry (the exact version Tauri pins) plus Fabricator's local patches in
# vendor/wry-patches:
#   0001  WebView2 device-compliance SSO: turns on the `AllowSingleSignOnUsingOSPrimaryAccount`
#         environment option so the preview can sign in to apps behind a Conditional Access
#         "require compliant/managed device" policy. Upstream wry exposes no setter for it.
#   0002  macOS child webview title-bar inset: keeps the preview from covering its toolbar.
# The override only applies while vendor/wry has exactly the version Tauri asks for. After a
# Tauri bump that moves wry, Cargo just warns and builds the unpatched registry crate, so
# src/vendor_guard.rs fails `cargo test` until you re-vendor with
# `node scripts/wry/vendor-wry.mjs update <version>`. Full notes: docs/VENDORED-WRY-PATCH.md.
[patch.crates-io]
wry = { path = "vendor/wry" }
