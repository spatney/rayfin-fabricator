name: Docs

# Builds the documentation site in website/ and publishes it to GitHub Pages at
# https://spatney.github.io/rayfin-fabricator/. Pull requests only build and verify it.
on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      # The site reads the app version from it, and the app links into the docs.
      - 'package.json'
      - 'src/shared/docs-links.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'package.json'
      - 'src/shared/docs-links.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          # The build stamps `last_updated` on every page from git commit dates.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - name: Lint content
        run: npm run check:docs

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      # Pages serves this project site under /rayfin-fabricator. A custom domain would
      # change both values, so they come from the Pages configuration when deploying.
      # Exported for every later step: the verify scripts read them too.
      - name: Resolve site URL
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "NEXT_PUBLIC_SITE_URL=https://spatney.github.io/rayfin-fabricator" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_BASE_PATH=/rayfin-fabricator" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_SITE_URL=$PAGES_URL" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_BASE_PATH=$PAGES_PATH" >> "$GITHUB_ENV"
          fi

      # Static export plus the agent surface: .md mirrors, llms.txt, AGENTS.md, sitemap.
      - name: Build
        run: npm run build

      # After the build, which generates next-env.d.ts and .next/types.
      - name: Typecheck
        run: npm run typecheck

      - name: Verify agent surface
        run: npm run verify:agent

      # The desktop app links to these pages and headings (src/shared/docs-links.json).
      - name: Verify in-app links
        run: npm run verify:app-links

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/out
          # Since v4 dotfiles are left out by default; keep shipping out/.nojekyll.
          include-hidden-files: true

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
